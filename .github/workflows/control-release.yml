# allow: SIZE_OK - one atomic signed multi-platform candidate pipeline.
name: control-release
run-name: control-candidate:${{ inputs.version || github.ref_name }}:${{ github.run_id }}

on:
  push:
    tags: ["control-v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version: { description: Exact candidate version from apps/control/VERSION, required: true, type: string }
      invocation_mode: { description: Explicit direct staging mode, required: true, type: choice, options: [standalone-staging] }
permissions:
  contents: read

concurrency:
  group: control-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    permissions: { contents: read }
    uses: ./.github/workflows/control-qualification-staging.yml
    secrets:
      CONTROL_ANDROID_JKS_B64: ${{ secrets.CONTROL_ANDROID_JKS_B64 }}
      CONTROL_ANDROID_STORE_PASSWORD: ${{ secrets.CONTROL_ANDROID_STORE_PASSWORD }}
      CONTROL_ANDROID_KEY_ALIAS: ${{ secrets.CONTROL_ANDROID_KEY_ALIAS }}
      CONTROL_ANDROID_KEY_PASSWORD: ${{ secrets.CONTROL_ANDROID_KEY_PASSWORD }}
      CONTROL_ANDROID_CERT_SHA256: ${{ secrets.CONTROL_ANDROID_CERT_SHA256 }}
      CONTROL_WINDOWS_PFX_B64: ${{ secrets.CONTROL_WINDOWS_PFX_B64 }}
      CONTROL_WINDOWS_PFX_PASSWORD: ${{ secrets.CONTROL_WINDOWS_PFX_PASSWORD }}
    with:
      version: ${{ inputs.version || '' }}
      invocation_mode: ${{ github.event_name == 'push' && 'tag' || inputs.invocation_mode }}
      caller_run_id: ''
      caller_run_attempt: ''
      caller_ref: ''
      caller_sha: ''
      caller_workflow_path: ''
  product-qualification-handoff:
    needs: staging
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.staging.result == 'success'
    runs-on: ubuntu-24.04
    environment: product-promotion
    permissions: { contents: read, actions: read }
    outputs:
      candidate_run_id: ${{ steps.bindings.outputs.candidate_run_id }}
      candidate_artifact_id: ${{ steps.bindings.outputs.candidate_artifact_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - name: Install exact gh and jq
        run: |
          ./packaging/control/install-linux-tools.sh "$RUNNER_TEMP/product-gate-tools"
          echo "$RUNNER_TEMP/product-gate-tools" >> "$GITHUB_PATH"
      - name: Authenticate complete upstream run and artifact metadata before download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ vars.PRODUCT_GATE_ARTIFACT_ID }}
          EXPECTED_ARTIFACT_DIGEST: ${{ vars.PRODUCT_GATE_ARTIFACT_DIGEST }}
          EXPECTED_ARTIFACT_SIZE: ${{ vars.PRODUCT_GATE_ARTIFACT_SIZE }}
          EXPECTED_RUN_ID: ${{ vars.PRODUCT_QUALIFICATION_RUN_ID }}
          EXPECTED_RUN_ATTEMPT: ${{ vars.PRODUCT_QUALIFICATION_RUN_ATTEMPT }}
        run: |
          set -euo pipefail
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg runId "$EXPECTED_RUN_ID" --argjson runAttempt "$EXPECTED_RUN_ATTEMPT" --arg headSha "$GITHUB_SHA" --arg id "$EXPECTED_ARTIFACT_ID" --arg digest "${EXPECTED_ARTIFACT_DIGEST#sha256:}" --argjson size "$EXPECTED_ARTIFACT_SIZE" '{repository:$repository,workflowPath:".github/workflows/product-qualification-dispatch.yml",eventName:"workflow_dispatch",runId:$runId,runAttempt:$runAttempt,headSha:$headSha,artifacts:[{id:$id,name:"jastreamer-qualified-product-gate",digest:$digest,size:$size}]}' > product-gate-provider-context.json
          bun tooling/release/provider-observation-cli.ts --context product-gate-provider-context.json --output product-gate-provider-observation.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ vars.PRODUCT_GATE_ARTIFACT_ID }}
          path: product-gate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ vars.PRODUCT_QUALIFICATION_RUN_ID }}
      - id: bindings
        name: Verify Todo19 K17 WASAPI production qualification and expose signed staging IDs
        env: { EXPECTED_GATE_SHA256: '${{ vars.PRODUCT_GATE_SHA256 }}' }
        run: |
          set -euo pipefail
          test -n "$EXPECTED_GATE_SHA256"
          test "$(sha256sum product-gate/product-gate.json | cut -d' ' -f1)" = "$EXPECTED_GATE_SHA256"
          bun tooling/release/product-gate-cli.mjs --receipt product-gate/product-gate.json --root product-gate \
            --trust-config tooling/release/product-gate-production-trust-v1.json \
            --mutation-ledger product-gate/evidence/cleanup/external-mutation-ledger.jsonl --output product-gate/verified.json
          test "$(jq -r .trust.profile product-gate/verified.json)" = production
          printf 'candidate_run_id=%s\n' "$(jq -r .publication.candidates.control.staging.runId product-gate/verified.json)" >> "$GITHUB_OUTPUT"
          printf 'candidate_artifact_id=%s\n' "$(jq -r .publication.candidates.control.staging.artifactId product-gate/verified.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: control-product-gate-handoff, path: product-gate, if-no-files-found: error }

  publish-qualified:
    needs: [staging, product-qualification-handoff]
    if: >-
      github.repository == 'furyheimdall/jastreamer' && github.event_name == 'push' && github.ref_type == 'tag' &&
      github.ref_name == needs.staging.outputs.candidate_tag && needs.staging.result == 'success' &&
      needs.product-qualification-handoff.result == 'success'
    runs-on: ubuntu-24.04
    environment: product-promotion
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - name: Install exact gh and jq
        run: |
          ./packaging/control/install-linux-tools.sh "$RUNNER_TEMP/publication-tools"
          echo "$RUNNER_TEMP/publication-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: control-product-gate-handoff, path: product-gate }
      - name: Re-run production trust and exact-byte verification
        env: { EXPECTED_GATE_SHA256: '${{ vars.PRODUCT_GATE_SHA256 }}' }
        run: |
          test "$(sha256sum product-gate/product-gate.json | cut -d' ' -f1)" = "$EXPECTED_GATE_SHA256"
          bun tooling/release/product-gate-cli.mjs --receipt product-gate/product-gate.json --root product-gate \
            --trust-config tooling/release/product-gate-production-trust-v1.json \
            --mutation-ledger product-gate/evidence/cleanup/external-mutation-ledger.jsonl --output product-gate/final-verified.json
      - name: Independently authenticate signed Control candidate provider metadata before download
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          jq '.publication.candidates.control.staging | {repository,workflowPath,eventName,runId,runAttempt,headSha,artifacts:[{id:.artifactId,name:.artifactName,digest:.artifactDigest}]}' product-gate/final-verified.json > candidate-provider-context.json
          bun tooling/release/provider-observation-cli.ts --context candidate-provider-context.json --output candidate-provider-observation.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.product-qualification-handoff.outputs.candidate_artifact_id }}
          path: candidate-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.product-qualification-handoff.outputs.candidate_run_id }}
      - name: Publish only the prebuilt certified Control bytes transactionally
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_RECEIPT_HMAC_KEY_B64: ${{ secrets.PUBLICATION_RECEIPT_HMAC_KEY_B64 }}
          EXPECTED_GATE_SHA256: ${{ vars.PRODUCT_GATE_SHA256 }}
        run: |
          jq -n --arg component control --arg eventName "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" \
            --arg refType "$GITHUB_REF_TYPE" --arg refName "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" --arg actor "$GITHUB_ACTOR" \
            --arg gateSha "$EXPECTED_GATE_SHA256" --arg stageRoot "$GITHUB_WORKSPACE/candidate-download/publication-stage" \
            --arg receipt "$GITHUB_WORKSPACE/publication-receipt.json" \
            '{schemaVersion:1,mode:"production",component:$component,repository:"furyheimdall/jastreamer",environment:"product-promotion",event:{name:$eventName,ref:$ref,refType:$refType,refName:$refName,sha:$sha},publisherRun:{id:$runId,attempt:$runAttempt,actor:$actor},gate:{root:"product-gate",receiptPath:"product-gate.json",verifiedPath:"final-verified.json",expectedReceiptSha256:$gateSha},stageRoot:$stageRoot,receiptPath:$receipt}' \
            > publication-request.json
          bun tooling/release/publication-cli.ts --request publication-request.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && hashFiles('publication-receipt.json') != ''
        with:
          name: control-publication-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-receipt.json
          if-no-files-found: error
