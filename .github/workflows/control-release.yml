# allow: SIZE_OK - one atomic signed multi-platform candidate pipeline.
name: control-release
run-name: control-candidate:${{ inputs.version || github.ref_name }}:${{ github.run_id }}

on:
  push:
    tags: ["control-v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version: { description: Exact candidate version from apps/control/VERSION, required: true, type: string }
      invocation_mode: { description: Explicit direct staging mode, required: true, type: choice, options: [standalone-staging] }
  workflow_call:
    inputs:
      version: { required: true, type: string }
      invocation_mode: { required: true, type: string }
      caller_run_id: { required: true, type: string }
      caller_run_attempt: { required: true, type: string }
      caller_ref: { required: true, type: string }
      caller_sha: { required: true, type: string }
      caller_workflow_path: { required: true, type: string }
    secrets:
      CONTROL_ANDROID_JKS_B64: { required: false }
      CONTROL_ANDROID_STORE_PASSWORD: { required: false }
      CONTROL_ANDROID_KEY_ALIAS: { required: false }
      CONTROL_ANDROID_KEY_PASSWORD: { required: false }
      CONTROL_ANDROID_CERT_SHA256: { required: false }
      CONTROL_WINDOWS_PFX_B64: { required: false }
      CONTROL_WINDOWS_PFX_PASSWORD: { required: false }
      PUBLICATION_RECEIPT_HMAC_KEY_B64: { required: false }
    outputs:
      caller_run_id: { value: '${{ jobs.stage.outputs.caller_run_id }}' }
      caller_run_attempt: { value: '${{ jobs.stage.outputs.caller_run_attempt }}' }
      caller_ref: { value: '${{ jobs.stage.outputs.caller_ref }}' }
      caller_sha: { value: '${{ jobs.stage.outputs.caller_sha }}' }
      called_workflow_path: { value: '${{ jobs.stage.outputs.called_workflow_path }}' }
      called_job: { value: '${{ jobs.stage.outputs.called_job }}' }
      called_output_identity: { value: '${{ jobs.stage.outputs.called_output_identity }}' }
      artifact_id: { value: '${{ jobs.stage.outputs.artifact_id }}' }
      artifact_digest: { value: '${{ jobs.stage.outputs.artifact_digest }}' }
      artifact_name: { value: '${{ jobs.stage.outputs.artifact_name }}' }
      staging_binding_artifact_id: { value: '${{ jobs.stage.outputs.staging_binding_artifact_id }}' }
      staging_binding_artifact_digest: { value: '${{ jobs.stage.outputs.staging_binding_artifact_digest }}' }
      staging_binding_artifact_name: { value: '${{ jobs.stage.outputs.staging_binding_artifact_name }}' }
      staging_binding_sha256: { value: '${{ jobs.stage.outputs.staging_binding_sha256 }}' }

permissions:
  contents: read

concurrency:
  group: control-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invocation-authorization:
    if: github.repository == 'furyheimdall/jastreamer'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Authorize invocation before repository code
        env:
          INVOCATION_MODE: ${{ inputs.invocation_mode }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          CALLER_RUN_ATTEMPT: ${{ inputs.caller_run_attempt }}
          CALLER_REF: ${{ inputs.caller_ref }}
          CALLER_SHA: ${{ inputs.caller_sha }}
          CALLER_WORKFLOW_PATH: ${{ inputs.caller_workflow_path }}
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$INVOCATION_MODE" == authoritative ]]; then
            test "$REF_PROTECTED" = true
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
            test "$CALLER_RUN_ID" = "$GITHUB_RUN_ID"
            test "$CALLER_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
            test "$CALLER_REF" = "$GITHUB_REF"
            test "$CALLER_SHA" = "$GITHUB_SHA"
            test "$CALLER_WORKFLOW_PATH" = '.github/workflows/product-qualification-dispatch.yml'
            test "$ACTUAL_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$CALLER_WORKFLOW_PATH@$GITHUB_REF"
          elif [[ "$INVOCATION_MODE" == standalone-staging ]]; then
            test "$REF_PROTECTED" = true
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
            test "$ACTUAL_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/control-release.yml@$GITHUB_REF"
            test -z "$CALLER_RUN_ID$CALLER_RUN_ATTEMPT$CALLER_REF$CALLER_SHA$CALLER_WORKFLOW_PATH"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/control-v* ]]; then
            test "$ACTUAL_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/control-release.yml@$GITHUB_REF"
            test -z "$INVOCATION_MODE$CALLER_RUN_ID$CALLER_RUN_ATTEMPT$CALLER_REF$CALLER_SHA$CALLER_WORKFLOW_PATH"
          else
            exit 64
          fi

  validate:
    needs: invocation-authorization
    if: needs.invocation-authorization.result == 'success' && github.repository == 'furyheimdall/jastreamer'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      candidate_tag: ${{ steps.version.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: { flutter-version: '3.35.1', channel: stable, cache: false }
      - id: version
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          CALLER_RUN_ATTEMPT: ${{ inputs.caller_run_attempt }}
          CALLER_REF: ${{ inputs.caller_ref }}
          CALLER_SHA: ${{ inputs.caller_sha }}
          CALLER_WORKFLOW_PATH: ${{ inputs.caller_workflow_path }}
          ACTUAL_CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_EVENT_NAME == push ]]; then candidate_tag=$GITHUB_REF_NAME; else candidate_tag="control-v$CANDIDATE_VERSION"; fi
          if [[ -n "$CALLER_RUN_ID" ]]; then
            [[ "$CALLER_RUN_ID" =~ ^[1-9][0-9]*$ && "$CALLER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            test "$CALLER_RUN_ID" = "$GITHUB_RUN_ID"
            test "$CALLER_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
            test "$CALLER_REF" = "$GITHUB_REF"
            test "$CALLER_SHA" = "$GITHUB_SHA"
            test "$CALLER_WORKFLOW_PATH" = '.github/workflows/product-qualification-dispatch.yml'
            test "$ACTUAL_CALLER_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$CALLER_WORKFLOW_PATH@$GITHUB_REF"
          fi
          GITHUB_REF_TYPE=tag ./packaging/control/validate-release.sh "$candidate_tag"
          printf 'version=%s\n' "${candidate_tag#control-v}" >> "$GITHUB_OUTPUT"
          printf 'candidate_tag=%s\n' "$candidate_tag" >> "$GITHUB_OUTPUT"
      - name: Test Control and release tooling
        run: |
          cd apps/control
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test
          cd ../..
          bun install --cwd packaging/control --frozen-lockfile
          bun run --cwd packaging/control test
          bun run --cwd packaging/control typecheck

  web:
    needs: validate
    if: github.repository == 'furyheimdall/jastreamer'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.25.6', check-latest: false, cache: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: { flutter-version: '3.35.1', channel: stable, cache: false }
      - name: Build real installable Web PWA
        run: |
          cd apps/control
          flutter pub get --enforce-lockfile
          flutter build web --release --build-name '${{ needs.validate.outputs.version }}'
          cd build/web
          zip -X -q -r "../../../../jastreamer-control_${{ needs.validate.outputs.version }}_web.zip" .
          unzip -t "../../../../jastreamer-control_${{ needs.validate.outputs.version }}_web.zip"
      - name: Run exact staged Web QA
        env:
          CONTROL_WEB_ROOT: ${{ runner.temp }}/control-web-candidate
          CONTROL_FIXTURE: ${{ github.workspace }}/tooling/fixtures/e2e/control-policy-happy.yaml
          CONTROL_OUTPUT: ${{ runner.temp }}/control-web-qa
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/jastreamer-control_${{ needs.validate.outputs.version }}_web.zip"
          rm -rf "$CONTROL_WEB_ROOT" "$CONTROL_OUTPUT"
          mkdir -p "$CONTROL_WEB_ROOT" "$CONTROL_OUTPUT"
          unzip -q "$archive" -d "$CONTROL_WEB_ROOT"
          test -f "$CONTROL_WEB_ROOT/index.html"
          cd tooling/qa
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bunx playwright test control.spec.mjs --browser chromium --workers 1 --reporter line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-web-candidate-ci
          path: jastreamer-control_${{ needs.validate.outputs.version }}_web.zip
          if-no-files-found: error

  android:
    needs: validate
    if: github.repository == 'furyheimdall/jastreamer'
    runs-on: ubuntu-24.04
    environment: control-android-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: { flutter-version: '3.35.1', channel: stable, cache: false }
      - name: Install exact Android APK verifier
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version
      - name: Build and verify project-signed universal APK and CI-only AAB
        env:
          CONTROL_ANDROID_JKS_B64: ${{ secrets.CONTROL_ANDROID_JKS_B64 }}
          CONTROL_ANDROID_STORE_PASSWORD: ${{ secrets.CONTROL_ANDROID_STORE_PASSWORD }}
          CONTROL_ANDROID_KEY_ALIAS: ${{ secrets.CONTROL_ANDROID_KEY_ALIAS }}
          CONTROL_ANDROID_KEY_PASSWORD: ${{ secrets.CONTROL_ANDROID_KEY_PASSWORD }}
          CONTROL_ANDROID_CERT_SHA256: ${{ secrets.CONTROL_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          signing="$RUNNER_TEMP/control-android-signing"
          mkdir -p "$signing" dist ci
          keystore="$signing/control-release.jks"
          cleanup() { rm -rf "$signing"; }
          trap cleanup EXIT
          for secret in CONTROL_ANDROID_STORE_PASSWORD CONTROL_ANDROID_KEY_ALIAS CONTROL_ANDROID_KEY_PASSWORD CONTROL_ANDROID_CERT_SHA256; do
            value=${!secret}; test -n "$value"; printf '::add-mask::%s\n' "$value"
          done
          printf '%s' "$CONTROL_ANDROID_JKS_B64" | base64 --decode > "$keystore"
          export CONTROL_ANDROID_KEYSTORE="$keystore"
          cd apps/control
          flutter pub get --enforce-lockfile
          flutter build apk --release --build-name '${{ needs.validate.outputs.version }}' --build-number 1002002
          cp build/app/outputs/flutter-apk/app-release.apk ../../ci/control-upgrade-v1.apk
          flutter build apk --release --build-name '${{ needs.validate.outputs.version }}' --build-number 1002003
          cp build/app/outputs/flutter-apk/app-release.apk "../../dist/jastreamer-control_${{ needs.validate.outputs.version }}_android_universal.apk"
          flutter build appbundle --release --build-name '${{ needs.validate.outputs.version }}' --build-number 1002003
          cp build/app/outputs/bundle/release/app-release.aab "../../ci/jastreamer-control_${{ needs.validate.outputs.version }}_android.aab"
          cd ../..
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/jastreamer-control_${{ needs.validate.outputs.version }}_android_universal.apk" | tee dist/android-signature.txt
          fingerprint=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}' dist/android-signature.txt)
          test "$fingerprint" = "$(printf '%s' "$CONTROL_ANDROID_CERT_SHA256" | tr '[:lower:]' '[:upper:]')"
          printf 'SHA256: %s\n' "$fingerprint" > dist/Android-CERT-SHA256.txt
          jarsigner -verify "ci/jastreamer-control_${{ needs.validate.outputs.version }}_android.aab" | tee dist/android-aab-signature.txt
          keytool -printcert -jarfile "ci/jastreamer-control_${{ needs.validate.outputs.version }}_android.aab" -rfc > ci/android-aab-cert.pem
          aab_fingerprint=$(openssl x509 -in ci/android-aab-cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$aab_fingerprint" = "$fingerprint"
          unzip -Z1 "dist/jastreamer-control_${{ needs.validate.outputs.version }}_android_universal.apk" | grep -E '^lib/(armeabi-v7a|arm64-v8a|x86_64)/libapp\.so$' | sort -u > dist/android-abis.txt
          test "$(wc -l < dist/android-abis.txt)" -eq 3
      - name: Prove same-key Android in-place update
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh packaging/control/test-android-upgrade.sh ci/control-upgrade-v1.apk "dist/jastreamer-control_${{ needs.validate.outputs.version }}_android_universal.apk" dist/android-upgrade-inspection.json
      - name: Prove no Android signing material remains
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/control-android-signing"
          test ! -e "$RUNNER_TEMP/control-android-signing"
          ! find dist ci -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.pfx' -o -name '*.p12' -o -name '*.key' \) | grep -q .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-android-candidate-ci
          path: |
            dist/jastreamer-control_${{ needs.validate.outputs.version }}_android_universal.apk
            dist/Android-CERT-SHA256.txt
            dist/android-upgrade-inspection.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-aab-validation
          path: ci/jastreamer-control_${{ needs.validate.outputs.version }}_android.aab
          retention-days: 1
          if-no-files-found: error

  windows:
    needs: validate
    if: github.repository == 'furyheimdall/jastreamer'
    runs-on: windows-2022
    environment: control-windows-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: { flutter-version: '3.35.1', channel: stable, cache: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: { dotnet-version: '8.0.419', cache: false }
      - name: Install exact Windows SDK MakeAppx and SignTool
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'Microsoft.Windows.SDK.BuildTools.10.0.26100.3916'
          nuget install Microsoft.Windows.SDK.BuildTools -Version 10.0.26100.3916 -OutputDirectory $env:RUNNER_TEMP -DirectDownload -NonInteractive
          $makeAppx = Get-ChildItem $directory -Recurse -Filter MakeAppx.exe | Where-Object FullName -Match '\\x64\\MakeAppx\.exe$' | Select-Object -First 1
          $signTool = Get-ChildItem $directory -Recurse -Filter SignTool.exe | Where-Object FullName -Match '\\x64\\SignTool\.exe$' | Select-Object -First 1
          if (!$makeAppx -or !$signTool) { throw 'pinned Windows SDK tools not found' }
          "JASTREAMER_MAKEAPPX=$($makeAppx.FullName)" >> $env:GITHUB_ENV
          "JASTREAMER_SIGNTOOL=$($signTool.FullName)" >> $env:GITHUB_ENV
      - name: Build, package, sign, trust-test, and remove Control MSIX
        shell: pwsh
        env:
          CONTROL_WINDOWS_PFX_B64: ${{ secrets.CONTROL_WINDOWS_PFX_B64 }}
          CONTROL_WINDOWS_PFX_PASSWORD: ${{ secrets.CONTROL_WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '${{ needs.validate.outputs.version }}'
          $pfx = Join-Path $env:RUNNER_TEMP 'control-signing.pfx'
          $trustedPath = $null
          $certificate = $null
          try {
            if (!$env:CONTROL_WINDOWS_PFX_B64 -or !$env:CONTROL_WINDOWS_PFX_PASSWORD) { throw 'protected Windows signing inputs required' }
            Write-Output "::add-mask::$env:CONTROL_WINDOWS_PFX_PASSWORD"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CONTROL_WINDOWS_PFX_B64))
            $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:CONTROL_WINDOWS_PFX_PASSWORD, $flags)
            $published = [Security.Cryptography.X509Certificates.X509Certificate2]::new('packaging/control/signing/control-windows.cer')
            if ($certificate.Thumbprint -ne $published.Thumbprint) { throw 'PFX certificate mismatch' }
            Push-Location apps/control
            flutter pub get --enforce-lockfile
            flutter test
            flutter build windows --release --build-name $version
            Pop-Location
            $stage = Join-Path $env:RUNNER_TEMP 'control-msix'
            Copy-Item apps/control/build/windows/x64/runner/Release $stage -Recurse
            New-Item "$stage/Assets" -ItemType Directory -Force | Out-Null
            $pixel = [Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZrN8AAAAASUVORK5CYII=')
            foreach ($name in 'StoreLogo.png','Square44x44Logo.png','Square150x150Logo.png') { [IO.File]::WriteAllBytes("$stage/Assets/$name", $pixel) }
            $manifest = @(
              '<?xml version="1.0" encoding="utf-8"?>'
              '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">'
              "  <Identity Name=`"io.jastreamer.control`" Publisher=`"CN=jastreamer`" Version=`"$version.0`" />"
              '  <Properties><DisplayName>jastreamer Control</DisplayName><PublisherDisplayName>jastreamer</PublisherDisplayName><Logo>Assets/StoreLogo.png</Logo></Properties>'
              '  <Resources><Resource Language="en-us" /></Resources>'
              '  <Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.19041.0" MaxVersionTested="10.0.26100.0" /></Dependencies>'
              '  <Applications><Application Id="Control" Executable="jastreamer_control.exe" EntryPoint="Windows.FullTrustApplication"><uap:VisualElements DisplayName="jastreamer Control" Description="jastreamer Control" Square150x150Logo="Assets/Square150x150Logo.png" Square44x44Logo="Assets/Square44x44Logo.png" BackgroundColor="transparent" /></Application></Applications>'
              '  <Capabilities><Capability Name="internetClient" /><rescap:Capability Name="runFullTrust" /></Capabilities>'
              '</Package>'
            ) -join "`n"
            $manifest | Set-Content "$stage/AppxManifest.xml"
            New-Item dist -ItemType Directory -Force | Out-Null
            $msix = [IO.Path]::GetFullPath("dist/jastreamer-control_${version}_windows.msix")
            & $env:JASTREAMER_MAKEAPPX pack /o /d $stage /p $msix
            & $env:JASTREAMER_SIGNTOOL sign /fd SHA256 /f $pfx /p $env:CONTROL_WINDOWS_PFX_PASSWORD $msix
            $quotedMsix = $msix.Replace("'", "''")
            $installCommand = "Add-AppxPackage -Path '$quotedMsix' -ErrorAction Stop"
            $nativeErrorPreference = $PSNativeCommandUseErrorActionPreference
            $PSNativeCommandUseErrorActionPreference = $false
            & powershell.exe -NoProfile -NonInteractive -Command $installCommand *> dist/windows-untrusted-install.txt
            $untrustedExit = $LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
            if ($untrustedExit -eq 0) { throw 'MSIX installed before explicit trust' }
            $imported = Import-Certificate -FilePath packaging/control/signing/control-windows.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople
            $trustedPath = "Cert:\LocalMachine\TrustedPeople\$($imported.Thumbprint)"
            & $env:JASTREAMER_SIGNTOOL verify /pa /v $msix
            & powershell.exe -NoProfile -NonInteractive -Command $installCommand
            $removeCommand = "Get-AppxPackage -Name 'io.jastreamer.control' -ErrorAction Stop | Remove-AppxPackage -ErrorAction Stop"
            & powershell.exe -NoProfile -NonInteractive -Command $removeCommand
            Copy-Item packaging/control/signing/control-windows.cer dist/
            Copy-Item packaging/control/signing/Windows-CERT-SHA256.txt dist/
            Copy-Item packaging/control/trust.md,packaging/control/remove-trust.md dist/
            @{classification='native-windows-amd64';identity='io.jastreamer.control';publisher='CN=jastreamer';version="$version.0";untrustedInstallRejected=$true;trustedInstallSucceeded=$true;uninstallSucceeded=$true} | ConvertTo-Json | Set-Content dist/windows-msix-inspection.json
          } finally {
            if ($certificate) { $certificate.Dispose() }
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            if ($trustedPath) { Remove-Item $trustedPath -Force -ErrorAction SilentlyContinue }
            Remove-Item Env:CONTROL_WINDOWS_PFX_B64,Env:CONTROL_WINDOWS_PFX_PASSWORD -ErrorAction SilentlyContinue
          }
      - name: Prove no Windows signing material remains
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP/control-signing.pfx") { throw 'PFX cleanup failed' }
          if (Test-Path dist) {
            if (Get-ChildItem dist -Recurse -Include *.pfx,*.p12,*.key,*.jks,*.keystore) { throw 'private signing material in artifact' }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-windows-candidate-ci
          path: dist
          if-no-files-found: error

  stage:
    needs: [validate, web, android, windows]
    if: github.repository == 'furyheimdall/jastreamer'
    runs-on: ubuntu-24.04
    outputs:
      caller_run_id: ${{ steps.metadata.outputs.caller_run_id }}
      caller_run_attempt: ${{ steps.metadata.outputs.caller_run_attempt }}
      caller_ref: ${{ steps.metadata.outputs.caller_ref }}
      caller_sha: ${{ steps.metadata.outputs.caller_sha }}
      called_workflow_path: .github/workflows/control-release.yml
      called_job: control
      called_output_identity: jobs.stage.outputs
      artifact_id: ${{ steps.publication-stage.outputs.artifact-id }}
      artifact_digest: ${{ steps.publication-stage.outputs.artifact-digest }}
      artifact_name: control-publication-stage-${{ github.run_id }}-${{ github.run_attempt }}
      staging_binding_artifact_id: ${{ steps.staging-binding.outputs.artifact-id }}
      staging_binding_artifact_digest: ${{ steps.staging-binding.outputs.artifact-digest }}
      staging_binding_artifact_name: control-publication-staging-binding-${{ github.run_id }}-${{ github.run_attempt }}
      staging_binding_sha256: ${{ steps.metadata.outputs.staging_binding_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - name: Install exact jq
        run: |
          ./packaging/control/install-linux-tools.sh "$RUNNER_TEMP/control-release-tools"
          echo "$RUNNER_TEMP/control-release-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: control-web-candidate-ci, path: incoming }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: control-android-candidate-ci, path: incoming }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: control-windows-candidate-ci, path: incoming }
      - name: Enforce public allowlist and generate release records
        env: { VERSION: '${{ needs.validate.outputs.version }}' }
        run: |
          set -euo pipefail
          mkdir stage
          find incoming -type f -exec cp {} stage/ \;
          cp LICENSE stage/Apache-2.0.txt
          cp tooling/policy/THIRD_PARTY_NOTICES.generated stage/THIRD_PARTY_NOTICES
          mapfile -t public < <(find stage -maxdepth 1 -type f \( -name '*.zip' -o -name '*.msix' -o -name '*.apk' \) -printf '%f\n' | sort)
          expected=("jastreamer-control_${VERSION}_android_universal.apk" "jastreamer-control_${VERSION}_web.zip" "jastreamer-control_${VERSION}_windows.msix")
          test "${public[*]}" = "${expected[*]}"
          ! find stage -type f \( -name '*.aab' -o -name '*.jks' -o -name '*.keystore' -o -name '*.pfx' -o -name '*.p12' -o -name '*.key' \) | grep -q .
          for name in "${public[@]}"; do sha256sum "stage/$name"; done > stage/SHA256SUMS
          subjects=$(for name in "${public[@]}"; do jq -n --arg name "$name" --arg sha "$(sha256sum "stage/$name" | cut -d' ' -f1)" '{name:$name,digest:{sha256:$sha}}'; done | jq -s .)
          jq -n --argjson subjects "$subjects" '{spdxVersion:"SPDX-2.3",dataLicense:"CC0-1.0",SPDXID:"SPDXRef-DOCUMENT",name:"jastreamer Control release",packages:[$subjects[]|{name:.name,SPDXID:("SPDXRef-"+.digest.sha256),downloadLocation:"NOASSERTION",filesAnalyzed:false,licenseConcluded:"Apache-2.0",licenseDeclared:"Apache-2.0",checksums:[{algorithm:"SHA256",checksumValue:.digest.sha256}]}]}' > stage/SBOM.spdx.json
          jq -n --argjson subject "$subjects" --arg revision "$GITHUB_SHA" --arg tag '${{ needs.validate.outputs.candidate_tag }}' '{_type:"https://in-toto.io/Statement/v1",subject:$subject,predicateType:"https://slsa.dev/provenance/v1",predicate:{buildDefinition:{buildType:"https://github.com/furyheimdall/jastreamer/control-candidate@v1",externalParameters:{candidateTag:$tag,publish:false}},runDetails:{builder:{id:"github-actions:control-release"},metadata:{sourceRevision:$revision}}}}' > stage/PROVENANCE.intoto.json
          records=$(for name in "${public[@]}"; do jq -n --arg name "$name" --arg sha "$(sha256sum "stage/$name" | cut -d' ' -f1)" '{name:$name,sha256:$sha}'; done | jq -s .)
          jq -n --arg tag '${{ needs.validate.outputs.candidate_tag }}' --arg revision "$GITHUB_SHA" --argjson artifacts "$records" '{schema:1,component:"control",tag:$tag,source_revision:$revision,promotionReady:false,artifacts:$artifacts}' > stage/manifest.json
          (cd stage && sha256sum * | sort -k2 > SHA256SUMS)
          manifest_sha256=$(sha256sum stage/manifest.json | cut -d' ' -f1)
          artifact_set_sha256=$(sha256sum stage/SHA256SUMS | cut -d' ' -f1)
          jq -n --arg manifest_sha256 "$manifest_sha256" --arg artifact_set_sha256 "$artifact_set_sha256" --arg revision "$GITHUB_SHA" '{schema:1,candidate:{status:"staged",component:"control",manifest_sha256:$manifest_sha256,artifact_set_sha256:$artifact_set_sha256,source_revision:$revision},external_writes:[]}' > stage/candidate.json
          mkdir publication-stage
          for name in "${public[@]}"; do cp -- "stage/$name" "publication-stage/$name"; done
          test "$(find publication-stage -maxdepth 1 -type f | wc -l)" -eq 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-candidate-ci
          path: stage
          if-no-files-found: error
      - name: Embed authoritative reusable-workflow metadata
        env:
          CALLER_RUN_ID: ${{ inputs.caller_run_id || github.run_id }}
          CALLER_RUN_ATTEMPT: ${{ inputs.caller_run_attempt || github.run_attempt }}
          CALLER_REF: ${{ inputs.caller_ref || github.ref }}
          CALLER_SHA: ${{ inputs.caller_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir qualification
          cp stage/manifest.json qualification/content-manifest.json
          content_manifest_sha256=$(sha256sum qualification/content-manifest.json | cut -d' ' -f1)
          contract_sha256=$(sha256sum tooling/release/qualification-artifact.schema.json | cut -d' ' -f1)
          jq -n --arg component control --arg callerRunId "$CALLER_RUN_ID" --argjson callerRunAttempt "$CALLER_RUN_ATTEMPT" --arg callerRef "$CALLER_REF" --arg callerSha "$CALLER_SHA" \
            --arg calledWorkflowPath '.github/workflows/control-release.yml' --arg calledJob control --arg runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" --arg sourceSha "$GITHUB_SHA" \
            --arg contentManifestSha256 "$content_manifest_sha256" --arg contractSha256 "$contract_sha256" \
            '{schemaVersion:2,component:$component,callerRunId:$callerRunId,callerRunAttempt:$callerRunAttempt,callerRef:$callerRef,callerSha:$callerSha,calledWorkflowPath:$calledWorkflowPath,calledJob:$calledJob,runId:$runId,runAttempt:$runAttempt,sourceSha:$sourceSha,contentManifestSha256:$contentManifestSha256,contractSha256:$contractSha256}' > qualification/candidate-binding.json
      - id: publication-stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-publication-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-stage
            qualification
          if-no-files-found: error
      - id: metadata
        name: Bind the exact provider-observed publication-stage artifact
        env:
          ARTIFACT_ID: ${{ steps.publication-stage.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.publication-stage.outputs.artifact-digest }}
          RELEASE_TAG: ${{ needs.validate.outputs.candidate_tag }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id || github.run_id }}
          CALLER_RUN_ATTEMPT: ${{ inputs.caller_run_attempt || github.run_attempt }}
          CALLER_REF: ${{ inputs.caller_ref || github.ref }}
          CALLER_SHA: ${{ inputs.caller_sha || github.sha }}
          PARENT_WORKFLOW_PATH: ${{ inputs.caller_run_id && '.github/workflows/product-qualification-dispatch.yml' || '.github/workflows/control-release.yml' }}
          PARENT_EVENT_NAME: ${{ inputs.caller_run_id && 'workflow_dispatch' || github.event_name }}
        run: |
          artifact_name="control-publication-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg workflowPath "$PARENT_WORKFLOW_PATH" \
            --arg eventName "$PARENT_EVENT_NAME" --arg headSha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" --arg artifactId "$ARTIFACT_ID" --arg artifactName "$artifact_name" \
            --arg artifactDigest "${ARTIFACT_DIGEST#sha256:}" --arg releaseTag "$RELEASE_TAG" \
            --arg callerRunId "$CALLER_RUN_ID" --argjson callerRunAttempt "$CALLER_RUN_ATTEMPT" --arg callerRef "$CALLER_REF" --arg callerSha "$CALLER_SHA" \
            --arg calledWorkflowPath '.github/workflows/control-release.yml' --arg calledJob control \
            --arg artifactAttemptProvenance 'caller-run+upload-output+embedded-manifest' --arg artifactManifestSha256 "$(sha256sum qualification/candidate-binding.json | cut -d' ' -f1)" --arg artifactContentManifestSha256 "$(sha256sum qualification/content-manifest.json | cut -d' ' -f1)" \
            '{repository:$repository,workflowPath:$workflowPath,eventName:$eventName,headSha:$headSha,runId:$runId,runAttempt:$runAttempt,artifactId:$artifactId,artifactName:$artifactName,artifactDigest:$artifactDigest,artifactAttemptProvenance:$artifactAttemptProvenance,artifactManifestSha256:$artifactManifestSha256,artifactContentManifestSha256:$artifactContentManifestSha256,callerRunId:$callerRunId,callerRunAttempt:$callerRunAttempt,callerRef:$callerRef,callerSha:$callerSha,calledWorkflowPath:$calledWorkflowPath,calledJob:$calledJob,releaseTag:$releaseTag}' > control-publication-staging.json
          printf 'caller_run_id=%s\n' "$CALLER_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'caller_run_attempt=%s\n' "$CALLER_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'caller_ref=%s\n' "$CALLER_REF" >> "$GITHUB_OUTPUT"
          printf 'caller_sha=%s\n' "$CALLER_SHA" >> "$GITHUB_OUTPUT"
          printf 'staging_binding_sha256=%s\n' "$(sha256sum control-publication-staging.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: staging-binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: 'control-publication-staging-binding-${{ github.run_id }}-${{ github.run_attempt }}', path: control-publication-staging.json, if-no-files-found: error }

  product-qualification-handoff:
    needs: stage
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.stage.result == 'success'
    runs-on: ubuntu-24.04
    environment: product-promotion
    permissions: { contents: read, actions: read }
    outputs:
      candidate_run_id: ${{ steps.bindings.outputs.candidate_run_id }}
      candidate_artifact_id: ${{ steps.bindings.outputs.candidate_artifact_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - name: Install exact gh and jq
        run: |
          ./packaging/control/install-linux-tools.sh "$RUNNER_TEMP/product-gate-tools"
          echo "$RUNNER_TEMP/product-gate-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ vars.PRODUCT_GATE_ARTIFACT_ID }}
          path: product-gate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ vars.PRODUCT_QUALIFICATION_RUN_ID }}
      - name: Verify exact upstream run and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ vars.PRODUCT_GATE_ARTIFACT_ID }}
          EXPECTED_ARTIFACT_DIGEST: ${{ vars.PRODUCT_GATE_ARTIFACT_DIGEST }}
          EXPECTED_RUN_ID: ${{ vars.PRODUCT_QUALIFICATION_RUN_ID }}
        run: |
          set -euo pipefail
          artifact=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID")
          test "$(jq -r .id <<<"$artifact")" = "$EXPECTED_ARTIFACT_ID"
          test "$(jq -r .name <<<"$artifact")" = jastreamer-qualified-product-gate
          test "${EXPECTED_ARTIFACT_DIGEST#sha256:}" = "$(jq -r .digest <<<"$artifact" | sed 's/^sha256://')"
          test "$(jq -r .workflow_run.id <<<"$artifact")" = "$EXPECTED_RUN_ID"
          run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_RUN_ID")
          test "$(jq -r .conclusion <<<"$run")" = success
      - id: bindings
        name: Verify Todo19 K17 WASAPI production qualification and expose signed staging IDs
        env: { EXPECTED_GATE_SHA256: '${{ vars.PRODUCT_GATE_SHA256 }}' }
        run: |
          set -euo pipefail
          test -n "$EXPECTED_GATE_SHA256"
          test "$(sha256sum product-gate/product-gate.json | cut -d' ' -f1)" = "$EXPECTED_GATE_SHA256"
          bun tooling/release/product-gate-cli.mjs --receipt product-gate/product-gate.json --root product-gate \
            --trust-config tooling/release/product-gate-production-trust-v1.json \
            --mutation-ledger product-gate/evidence/cleanup/external-mutation-ledger.jsonl --output product-gate/verified.json
          test "$(jq -r .trust.profile product-gate/verified.json)" = production
          printf 'candidate_run_id=%s\n' "$(jq -r .publication.candidates.control.staging.runId product-gate/verified.json)" >> "$GITHUB_OUTPUT"
          printf 'candidate_artifact_id=%s\n' "$(jq -r .publication.candidates.control.staging.artifactId product-gate/verified.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: control-product-gate-handoff, path: product-gate, if-no-files-found: error }

  publish-qualified:
    needs: [validate, web, android, windows, stage, product-qualification-handoff]
    if: >-
      github.repository == 'furyheimdall/jastreamer' && github.event_name == 'push' && github.ref_type == 'tag' &&
      github.ref_name == needs.validate.outputs.candidate_tag && needs.validate.result == 'success' &&
      needs.web.result == 'success' && needs.android.result == 'success' && needs.windows.result == 'success' &&
      needs.stage.result == 'success' && needs.product-qualification-handoff.result == 'success'
    runs-on: ubuntu-24.04
    environment: product-promotion
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - name: Install exact gh and jq
        run: |
          ./packaging/control/install-linux-tools.sh "$RUNNER_TEMP/publication-tools"
          echo "$RUNNER_TEMP/publication-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: control-product-gate-handoff, path: product-gate }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.product-qualification-handoff.outputs.candidate_artifact_id }}
          path: candidate-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.product-qualification-handoff.outputs.candidate_run_id }}
      - name: Re-run production trust and exact-byte verification
        env: { EXPECTED_GATE_SHA256: '${{ vars.PRODUCT_GATE_SHA256 }}' }
        run: |
          test "$(sha256sum product-gate/product-gate.json | cut -d' ' -f1)" = "$EXPECTED_GATE_SHA256"
          bun tooling/release/product-gate-cli.mjs --receipt product-gate/product-gate.json --root product-gate \
            --trust-config tooling/release/product-gate-production-trust-v1.json \
            --mutation-ledger product-gate/evidence/cleanup/external-mutation-ledger.jsonl --output product-gate/final-verified.json
      - name: Publish only the prebuilt certified Control bytes transactionally
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_RECEIPT_HMAC_KEY_B64: ${{ secrets.PUBLICATION_RECEIPT_HMAC_KEY_B64 }}
          EXPECTED_GATE_SHA256: ${{ vars.PRODUCT_GATE_SHA256 }}
        run: |
          jq -n --arg component control --arg eventName "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" \
            --arg refType "$GITHUB_REF_TYPE" --arg refName "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" --arg actor "$GITHUB_ACTOR" \
            --arg gateSha "$EXPECTED_GATE_SHA256" --arg stageRoot "$GITHUB_WORKSPACE/candidate-download/publication-stage" \
            --arg receipt "$GITHUB_WORKSPACE/publication-receipt.json" \
            '{schemaVersion:1,mode:"production",component:$component,repository:"furyheimdall/jastreamer",environment:"product-promotion",event:{name:$eventName,ref:$ref,refType:$refType,refName:$refName,sha:$sha},publisherRun:{id:$runId,attempt:$runAttempt,actor:$actor},gate:{root:"product-gate",receiptPath:"product-gate.json",verifiedPath:"final-verified.json",expectedReceiptSha256:$gateSha},stageRoot:$stageRoot,receiptPath:$receipt}' \
            > publication-request.json
          bun tooling/release/publication-cli.ts --request publication-request.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && hashFiles('publication-receipt.json') != ''
        with:
          name: control-publication-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-receipt.json
          if-no-files-found: error
