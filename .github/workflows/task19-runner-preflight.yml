name: task19-runner-preflight

on:
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: task19-runner-preflight
  cancel-in-progress: false

jobs:
  authorize:
    if: github.repository == 'furyheimdall/jastreamer'
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - id: gate
        name: Authorize protected default-branch preflight
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$ACTUAL_REF" = "refs/heads/$DEFAULT_BRANCH"
          printf 'authorized=true\n' >> "$GITHUB_OUTPUT"

  preflight:
    needs: authorize
    if: needs.authorize.result == 'success' && needs.authorize.outputs.authorized == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - name: Install exact Android platform tools
        shell: powershell
        env:
          PLATFORM_TOOLS_URL: https://dl.google.com/android/repository/platform-tools_r37.0.1-win.zip
          PLATFORM_TOOLS_SHA256: 45f4d63113e895ebde0c90f194099a4676b6ac653bd28d54314a9e022bbc1a99
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $archive = Join-Path $env:RUNNER_TEMP 'task19-platform-tools.zip'
          $installRoot = Join-Path $env:RUNNER_TEMP 'task19-platform-tools'
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -UseBasicParsing -Uri $env:PLATFORM_TOOLS_URL -OutFile $archive
          if ((Get-Item $archive).Length -ne 8044989) { throw 'TASK19_PLATFORM_TOOLS_SIZE_MISMATCH' }
          $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:PLATFORM_TOOLS_SHA256) { throw 'TASK19_PLATFORM_TOOLS_DIGEST_MISMATCH' }
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot
          $platformTools = Join-Path $installRoot 'platform-tools'
          if (!(Test-Path (Join-Path $platformTools 'adb.exe'))) { throw 'TASK19_ADB_ARCHIVE_INVALID' }
          [IO.File]::AppendAllText(
            $env:GITHUB_PATH,
            "$platformTools`n",
            [Text.UTF8Encoding]::new($false)
          )
      - name: Verify Windows runner and one authorized USB Android device
        shell: powershell
        run: tooling/qa/task19/runner-preflight.ps1 -Output task19-runner-preflight.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task19-runner-preflight
          path: task19-runner-preflight.json
          if-no-files-found: error
      - name: Remove temporary Android platform tools
        if: always()
        shell: powershell
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP 'task19-platform-tools.zip') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP 'task19-platform-tools') -Recurse -Force -ErrorAction SilentlyContinue
