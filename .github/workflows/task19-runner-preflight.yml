name: task19-runner-preflight

on:
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: task19-runner-preflight
  cancel-in-progress: false

jobs:
  authorize:
    if: github.repository == 'furyheimdall/jastreamer'
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - id: gate
        name: Authorize protected default-branch preflight
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$ACTUAL_REF" = "refs/heads/$DEFAULT_BRANCH"
          printf 'authorized=true\n' >> "$GITHUB_OUTPUT"

  preflight:
    needs: authorize
    if: needs.authorize.result == 'success' && needs.authorize.outputs.authorized == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - name: Verify Windows runner and one authorized USB Android device
        shell: powershell
        run: tooling/qa/task19/runner-preflight.ps1 -Output task19-runner-preflight.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task19-runner-preflight
          path: task19-runner-preflight.json
          if-no-files-found: error
