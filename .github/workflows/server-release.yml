name: server-release

on:
  push:
    tags: ["server-v*"]

permissions:
  contents: read

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/furyheimdall/jastreamer-server

jobs:
  validate:
    if: github.repository == 'furyheimdall/jastreamer'
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.25.6', check-latest: false, cache: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - name: Install exact jq
        run: |
          ./packaging/server/install-linux-tools.sh amd64 "$RUNNER_TEMP/server-release-tools"
          echo "$RUNNER_TEMP/server-release-tools" >> "$GITHUB_PATH"
      - id: version
        env: { GITHUB_REF_TYPE: tag }
        run: |
          ./packaging/server/validate-release.sh "$GITHUB_REF_NAME"
          printf 'version=%s\n' "${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"
      - name: Released-peer compatibility gate and pinned tool receipt
        run: |
          test "$(go version)" = 'go version go1.25.6 linux/amd64'
          test "$(bun --version)" = '1.3.14'
          jq_version=$(jq --version); test "$jq_version" = 'jq-1.7.1'
          ./tooling/componentctl compatibility run --matrix tooling/fixtures/compatibility/released-peers.yaml --output compatibility.json
          jq -n --arg go "$(go version)" --arg bun "$(bun --version)" --arg jq "$jq_version" '{go:$go,bun:$bun,jq:$jq}' > validation-tools.json
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with: { name: server-compatibility, path: "compatibility.json\nvalidation-tools.json", if-no-files-found: error }

  linux:
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, classification: native, debian: "debian@sha256:362e64223cc0da95422b3b13c045186fc0a81250e765d31c025fbddf257f6143", rocky: "rockylinux@sha256:197b1569a8e5d46de75412cfd80b88a437d25bb2a5338dc82d5421d835245ec7" }
          - { arch: arm64, runner: ubuntu-24.04-arm, classification: native, debian: "debian@sha256:817e6cf99d6fc127ff4ffe8580049b60deba0adfbbb2bd65ddc3ef8fbb7aade0", rocky: "rockylinux@sha256:99a073e7e92dc4cd2882c9418936bdd1c2298279c5af0f3642261286e135f6c7" }
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.25.6', check-latest: false, cache: false }
      - uses: docker/setup-docker-action@b60f85385d03ac8acfca6d9996982511d8620a19
        with: { version: v28.3.3 }
      - name: Install exact jq
        run: |
          ./packaging/server/install-linux-tools.sh '${{ matrix.arch }}' "$RUNNER_TEMP/server-release-tools"
          echo "$RUNNER_TEMP/server-release-tools" >> "$GITHUB_PATH"
      - name: Build real nFPM packages
        run: ./packaging/server/build-linux.sh '${{ needs.validate.outputs.version }}' '${{ matrix.arch }}' dist
      - name: Inspect, repository-free install, runtime smoke, and uninstall
        env:
          ARCH: ${{ matrix.arch }}
          CLASSIFICATION: ${{ matrix.classification }}
          VERSION: ${{ needs.validate.outputs.version }}
          DEBIAN_IMAGE: ${{ matrix.debian }}
          ROCKY_IMAGE: ${{ matrix.rocky }}
        run: |
          set -euo pipefail
          test "$(go version)" = "go version go1.25.6 linux/$ARCH"
          docker_version=$(docker version --format '{{.Server.Version}}'); test "$docker_version" = '28.3.3'
          jq_version=$(jq --version); test "$jq_version" = 'jq-1.7.1'
          dpkg-deb --info "dist/jastreamer-server_${VERSION}_linux_${ARCH}.deb" > dist/deb-inspection.txt
          dpkg-deb --contents "dist/jastreamer-server_${VERSION}_linux_${ARCH}.deb" >> dist/deb-inspection.txt
          docker run --rm --platform "linux/$ARCH" -v "$PWD/dist:/dist:ro" "$DEBIAN_IMAGE" sh -ec '
            dpkg -i "/dist/jastreamer-server_'"$VERSION"'_linux_'"$ARCH"'.deb" >/dev/null
            export JASTREAMER_SETUP_SECRET=native-ci-smoke JASTREAMER_ADDR=127.0.0.1:8443
            mkfifo /tmp/ready; cd /usr/lib/jastreamer-server
            ./jastreamer-server --config /etc/jastreamer/server.json >/tmp/ready 2>/tmp/error & pid=$!
            IFS= read -r ready </tmp/ready; case "$ready" in ready\ https://*) ;; *) cat /tmp/error >&2; exit 1;; esac
            kill -TERM "$pid"; wait "$pid"; dpkg -r jastreamer-server >/dev/null; printf "%s\n" "$ready"'
          docker run --rm --platform "linux/$ARCH" -v "$PWD/dist:/dist:ro" "$ROCKY_IMAGE" sh -ec '
            rpm -qip "/dist/jastreamer-server-'"$VERSION"'-1.'"$([[ $ARCH == amd64 ]] && echo x86_64 || echo aarch64)"'.rpm" >/dev/null 2>&1 || rpm -qip "/dist/jastreamer-server_'"$VERSION"'_linux_'"$ARCH"'.rpm"
            rpm -ivh --nodeps "/dist/jastreamer-server_'"$VERSION"'_linux_'"$ARCH"'.rpm" >/dev/null
            test -f /usr/lib/systemd/system/jastreamer-server.service; rpm -e jastreamer-server >/dev/null'
          jq -n --arg platform "linux/$ARCH" --arg classification "$CLASSIFICATION" '{platform:$platform,classification:$classification,packageFormats:["deb","rpm"],inspectors:["dpkg-deb","rpm"],runtimeSmoke:"ready",repositoryFreeInstall:true,uninstall:true,systemd:true}' > "dist/linux-${ARCH}-inspection.json"
          jq -n --arg go "$(go version)" --arg docker "$docker_version" --arg jq "$jq_version" '{go:$go,docker:$docker,jq:$jq}' > "dist/tools-linux-${ARCH}.json"
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: server-linux-${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-2025
    environment: server-signing
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.25.6', check-latest: false, cache: false }
      - name: Run native Windows security tests
        working-directory: apps/server
        run: go test ./internal/security
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: { dotnet-version: '8.0.419', cache: false }
      - name: Install exact Windows SDK SignTool
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'Microsoft.Windows.SDK.BuildTools.10.0.26100.3916'
          nuget install Microsoft.Windows.SDK.BuildTools -Version 10.0.26100.3916 -OutputDirectory $env:RUNNER_TEMP -DirectDownload -NonInteractive
          $signTool = Get-ChildItem $directory -Recurse -Filter signtool.exe |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Select-Object -First 1
          if (!$signTool) { throw 'pinned SignTool not found' }
          "JASTREAMER_SIGNTOOL=$($signTool.FullName)" >> $env:GITHUB_ENV
      - name: Build unsigned amd64 SCM host and runnable Server core inputs
        shell: pwsh
        run: ./packaging/server/build-windows.ps1 -Version '${{ needs.validate.outputs.version }}' -Output dist
      - name: Sign input EXEs, build MSI from signed inputs, sign MSI, and run native trust/service QA
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_B64: ${{ secrets.SERVER_WINDOWS_SIGNING_PFX_B64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.SERVER_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./packaging/server/sign-windows.ps1 -Version '${{ needs.validate.outputs.version }}' -Directory dist -Cer packaging/server/cert/server.cer
      - name: Prove no signing material remains
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP/jastreamer-server-signing.pfx") { throw 'PFX cleanup failed' }
          if (Test-Path dist) {
            if (Get-ChildItem dist -Recurse -Include *.pfx,*.p12,*.key) { throw 'private signing material in artifact' }
          }
          $thumbprint = (Get-PfxCertificate packaging/server/cert/server.cer).Thumbprint
          if (Test-Path "Cert:\LocalMachine\TrustedPeople\$thumbprint") { throw 'TrustedPeople certificate cleanup failed' }
          if (Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Services\jastreamer-server') {
            $environment = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\jastreamer-server' -Name Environment -ErrorAction SilentlyContinue
            if ($environment.Environment -match '^JASTREAMER_SETUP_SECRET=') { throw 'service secret environment cleanup failed' }
          }
          if (Get-Service jastreamer-server -ErrorAction SilentlyContinue) { throw 'service cleanup failed' }
          if ($env:WINDOWS_SIGNING_PFX_B64 -or $env:WINDOWS_SIGNING_PFX_PASSWORD) { throw 'signing environment cleanup failed' }
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with: { name: server-windows-amd64, path: dist, if-no-files-found: error }

  oci:
    needs: validate
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.25.6', check-latest: false, cache: false }
      - uses: docker/setup-docker-action@b60f85385d03ac8acfca6d9996982511d8620a19
        with: { version: v28.3.3 }
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with: { platforms: amd64 }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - name: Install exact jq
        run: |
          ./packaging/server/install-linux-tools.sh arm64 "$RUNNER_TEMP/server-release-tools"
          echo "$RUNNER_TEMP/server-release-tools" >> "$GITHUB_PATH"
      - name: Verify Todo17 two-platform OCI with native arm64 evidence
        env:
          SOURCE_DATE_EPOCH: "0"
          JASTREAMER_REVISION: ${{ github.sha }}
        run: |
          test "$(go version)" = 'go version go1.25.6 linux/arm64'
          test "$(bun --version)" = '1.3.14'
          docker_version=$(docker version --format '{{.Server.Version}}'); test "$docker_version" = '28.3.3'
          jq_version=$(jq --version); test "$jq_version" = 'jq-1.7.1'
          ./tooling/componentctl container build-qa --platform linux/amd64,linux/arm64 --compose deploy/docker/server/compose.synology.yaml --scenario replacement-persistence --oci-layout dist/server.oci --output dist/oci-inspection.json
          jq -n --arg go "$(go version)" --arg bun "$(bun --version)" --arg docker "$docker_version" --arg jq "$jq_version" '{go:$go,bun:$bun,docker:$docker,jq:$jq}' > dist/tools-oci.json
          jq -e --arg version '${{ needs.validate.outputs.version }}' '.status=="passed" and .version==$version and .manifestCount==2 and any(.runtime[]; .platform=="linux/arm64" and .classification=="native")' dist/oci-inspection.json
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with: { name: server-oci, path: dist, if-no-files-found: error }

  stage:
    needs: [validate, linux, windows, oci]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - name: Install exact jq
        run: |
          ./packaging/server/install-linux-tools.sh amd64 "$RUNNER_TEMP/server-release-tools"
          echo "$RUNNER_TEMP/server-release-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: { pattern: server-*, path: incoming }
      - name: Digest-address and enforce Server-only allowlist
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p stage
          find incoming/server-linux-* -type f \( -name '*.deb' -o -name '*.rpm' -o -name 'linux-*-inspection.json' -o -name 'tools-linux-*.json' \) -exec cp {} stage/ \;
          cp incoming/server-windows-amd64/jastreamer-server_${VERSION}_windows_amd64.{exe,msi} stage/
          cp incoming/server-windows-amd64/windows-{msi,signature}-inspection.json stage/
          cp incoming/server-windows-amd64/windows-tool-receipt.json stage/
          cp incoming/server-oci/tools-oci.json stage/
          cp incoming/server-compatibility/validation-tools.json stage/
          cp incoming/server-oci/server.oci stage/jastreamer-server_${VERSION}_linux_amd64-arm64.oci
          cp incoming/server-oci/oci-inspection.json stage/
          cp LICENSE stage/Apache-2.0.txt; cp packaging/container/THIRD_PARTY_NOTICES stage/
          cp packaging/server/cert/{server.cer,fingerprint.txt} stage/; cp packaging/server/{trust,remove-trust}.md stage/
          ! find stage -type f | grep -Ei '(control|renderer|\.pfx$|\.p12$|\.key$)'
          curl -fsSL https://github.com/anchore/syft/releases/download/v1.30.0/syft_1.30.0_linux_amd64.tar.gz -o syft.tgz
          echo 'f0cdcba0b6ce4c7a87050d524f732ba9fa2e711835f993a4ef108cfbf928ec13  syft.tgz' | sha256sum -c --status
          tar -xzf syft.tgz syft; rm syft.tgz
          mapfile -t distributables < <(find stage -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.oci' \) -printf '%f\n' | sort)
          [[ ${#distributables[@]} -eq 7 ]]
          for name in "${distributables[@]}"; do
            if [[ $name == *.oci ]]; then
              sha=$(sha256sum "stage/$name" | cut -d' ' -f1)
              jq -n --arg name "$name" --arg sha "$sha" --arg created "$(git show -s --format=%cI "$GITHUB_SHA" | sed 's/+00:00/Z/')" '{spdxVersion:"SPDX-2.3",dataLicense:"CC0-1.0",SPDXID:"SPDXRef-DOCUMENT",name:($name+" artifact SBOM"),documentNamespace:("https://github.com/furyheimdall/jastreamer/sbom/"+$sha),creationInfo:{created:$created,creators:["Tool: jastreamer-artifact-SPDX/1","Tool: BuildKit-Syft-scanner/stable-1"]},packages:[{name:$name,SPDXID:"SPDXRef-Package-OCI-Index",downloadLocation:"NOASSERTION",filesAnalyzed:false,licenseConcluded:"Apache-2.0",licenseDeclared:"Apache-2.0",copyrightText:"NOASSERTION",checksums:[{algorithm:"SHA256",checksumValue:$sha}]}],relationships:[{spdxElementId:"SPDXRef-DOCUMENT",relationshipType:"DESCRIBES",relatedSpdxElement:"SPDXRef-Package-OCI-Index"}]}' > "stage/$name.spdx.json"
            else
              ./syft scan "file:stage/$name" -o "spdx-json=stage/$name.spdx.json"
            fi
          done
          subjects=$(for name in "${distributables[@]}"; do sha=$(sha256sum "stage/$name" | cut -d' ' -f1); jq -n --arg name "$name" --arg sha "$sha" '{name:$name,digest:{sha256:$sha}}'; done | jq -s .)
          jq -n --argjson subjects "$subjects" --arg tag "$GITHUB_REF_NAME" --arg revision "$GITHUB_SHA" '{_type:"https://in-toto.io/Statement/v1",subject:$subjects,predicateType:"https://slsa.dev/provenance/v1",predicate:{buildDefinition:{buildType:"https://github.com/furyheimdall/jastreamer/server-release@v1",externalParameters:{tag:$tag}},runDetails:{builder:{id:"github-actions:server-release"},metadata:{sourceRevision:$revision}}}}' > stage/PROVENANCE.intoto.json
          jq -n '{draftRelease:"planned",ghcrImmutableTag:"planned",publishRelease:"planned",onFailure:["delete draft release","delete immutable GHCR tag","remove registry auth"],floatingTags:[]}' > stage/promotion-ledger.json
          records=$(find stage -maxdepth 1 -type f -printf '%f\n' | sort | while read -r name; do sha=$(sha256sum "stage/$name" | cut -d' ' -f1); jq -n --arg name "$name" --arg sha "$sha" '{name:$name,sha256:$sha}'; done | jq -s .)
          jq -n --arg tag "$GITHUB_REF_NAME" --arg image "$IMAGE:${VERSION}" --argjson artifacts "$records" '{schema:1,component:"server",tag:$tag,image:$image,floatingTags:false,promotionReady:true,artifacts:$artifacts}' > stage/manifest.json
          {
            printf '%s\n' "${distributables[@]}"
            printf '%s.spdx.json\n' "${distributables[@]}"
            printf '%s\n' Apache-2.0.txt THIRD_PARTY_NOTICES server.cer fingerprint.txt trust.md remove-trust.md \
              linux-amd64-inspection.json linux-arm64-inspection.json windows-msi-inspection.json windows-signature-inspection.json oci-inspection.json \
              tools-linux-amd64.json tools-linux-arm64.json windows-tool-receipt.json tools-oci.json validation-tools.json \
              PROVENANCE.intoto.json promotion-ledger.json manifest.json
          } | sort > expected-assets.txt
          find stage -maxdepth 1 -type f -printf '%f\n' | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          (cd stage && sha256sum * | sort -k2 > SHA256SUMS)
          printf '%s\n' SHA256SUMS >> expected-assets.txt; sort -o expected-assets.txt expected-assets.txt
          find stage -maxdepth 1 -type f -printf '%f\n' | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          rm -f syft expected-assets.txt actual-assets.txt
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with: { name: server-release-stage, path: stage, if-no-files-found: error }

  promote:
    needs: [validate, stage]
    if: github.repository == 'furyheimdall/jastreamer' && needs.stage.result == 'success'
    runs-on: ubuntu-24.04
    environment: server-release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.25.6', check-latest: false, cache: false }
      - uses: docker/setup-docker-action@b60f85385d03ac8acfca6d9996982511d8620a19
        with: { version: v28.3.3 }
      - name: Install exact gh and jq
        run: |
          ./packaging/server/install-linux-tools.sh amd64 "$RUNNER_TEMP/server-release-tools" true
          echo "$RUNNER_TEMP/server-release-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: { name: server-release-stage, path: stage }
      - name: Draft release, immutable GHCR promotion, then publish with compensation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          complete=false; logged_in=false; release_created=false; image_promotion_started=false
          export DOCKER_CONFIG="$RUNNER_TEMP/server-release-docker-auth"
          mkdir -m 0700 "$DOCKER_CONFIG"
          skopeo() {
            docker run --rm -v "$DOCKER_CONFIG/config.json:/auth.json:ro" \
              -v "$GITHUB_WORKSPACE/stage:/stage:ro" \
              quay.io/skopeo/stable@sha256:47853bb9fb24202af9110531ebd6e43c5f97701254ca290596640290d17942f4 "$@" --authfile /auth.json
          }
          absent_release() {
            local receipt=$1
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >"$receipt" 2>&1; then return 1; fi
            grep -Eqi 'release not found|HTTP 404|not found' "$receipt"
          }
          absent_registry_tag() {
            local receipt=$1
            if skopeo inspect "docker://$IMAGE:$VERSION" >"$receipt" 2>&1; then return 1; fi
            grep -Eqi 'manifest unknown|name unknown|not found' "$receipt"
          }
          cleanup() {
            local original=$?; trap - EXIT; local failures=()
            if [[ $complete != true ]]; then
              if [[ $release_created == true ]]; then
                if ! gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes; then failures+=(release-delete); fi
                if ! absent_release "$RUNNER_TEMP/cleanup-release-after.txt"; then failures+=(release-still-present-or-unverifiable); fi
              fi
              if [[ $image_promotion_started == true && $logged_in != true ]]; then
                mkdir -p -m 0700 "$DOCKER_CONFIG"
                if printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then logged_in=true; else failures+=(cleanup-registry-login); fi
              fi
              if [[ $image_promotion_started == true && $logged_in == true ]] && ! absent_registry_tag "$RUNNER_TEMP/cleanup-image-before.txt"; then
                if ! skopeo delete "docker://$IMAGE:$VERSION"; then failures+=(image-delete); fi
              fi
              if [[ $image_promotion_started == true && $logged_in == true ]] && ! absent_registry_tag "$RUNNER_TEMP/cleanup-image-after.txt"; then failures+=(image-still-present); fi
            fi
            if [[ $logged_in == true ]] && ! docker logout ghcr.io; then failures+=(registry-logout); fi
            rm -f "$DOCKER_CONFIG/config.json"
            if [[ -e $DOCKER_CONFIG/config.json ]]; then failures+=(registry-auth-still-present); fi
            if [[ -d $DOCKER_CONFIG ]] && ! rmdir "$DOCKER_CONFIG"; then failures+=(registry-auth-directory-cleanup); fi
            if ((${#failures[@]})); then printf 'compensation failures: %s\n' "${failures[*]}" >&2; exit 1; fi
            exit "$original"
          }
          trap cleanup EXIT
          go_version=$(go version); test "$go_version" = 'go version go1.25.6 linux/amd64'
          docker_version=$(docker version --format '{{.Server.Version}}'); test "$docker_version" = '28.3.3'
          gh_version=$(gh --version | awk 'NR==1{print $3}'); test "$gh_version" = '2.76.2'
          jq_version=$(jq --version); test "$jq_version" = 'jq-1.7.1'
          if ! absent_release "$RUNNER_TEMP/preflight-release.txt"; then echo RELEASE_ALREADY_EXISTS_OR_PREFLIGHT_FAILED >&2; cat "$RUNNER_TEMP/preflight-release.txt" >&2; exit 65; fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          logged_in=true
          if ! absent_registry_tag "$RUNNER_TEMP/preflight-image.txt"; then echo IMMUTABLE_IMAGE_TAG_ALREADY_EXISTS_OR_PREFLIGHT_FAILED >&2; cat "$RUNNER_TEMP/preflight-image.txt" >&2; exit 65; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "jastreamer Server $VERSION" --draft --verify-tag
          release_created=true
          gh release upload "$GITHUB_REF_NAME" stage/* --repo "$GITHUB_REPOSITORY"
          expected_digest=$(jq -r .indexDigest stage/oci-inspection.json); test "$expected_digest" != null
          image_promotion_started=true
          skopeo copy --all "oci-archive:/stage/jastreamer-server_${VERSION}_linux_amd64-arm64.oci" "docker://$IMAGE:$VERSION"
          pushed_digest=$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:$VERSION")
          test "$pushed_digest" = "$expected_digest"
          docker logout ghcr.io
          logged_in=false
          rm -f "$DOCKER_CONFIG/config.json"
          test ! -e "$DOCKER_CONFIG/config.json"
          rmdir "$DOCKER_CONFIG"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          jq -n --arg go "$go_version" --arg docker "$docker_version" --arg gh "$gh_version" --arg jq "$jq_version" --arg digest "$pushed_digest" \
            '{go:$go,docker:$docker,gh:$gh,jq:$jq,pushedDigest:$digest,registryAuth:"isolated-and-removed-by-trap"}' >> "$GITHUB_STEP_SUMMARY"
          complete=true
