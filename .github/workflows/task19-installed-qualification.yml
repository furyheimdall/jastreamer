name: task19-installed-qualification

on:
  workflow_dispatch:
    inputs:
      provider_run_id: { description: Exact authoritative product-qualification provider run ID, required: true, type: string }
      provider_run_attempt: { description: Exact provider run attempt, required: true, type: number }
permissions: { contents: read }
concurrency: { group: 'task19-installed-qualification-${{ github.ref }}', cancel-in-progress: false }

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'furyheimdall/jastreamer' && github.ref_protected == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: task19-qualification
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      authorization_receipt_b64: ${{ steps.sign.outputs.receipt_b64 }}
      authorization_signature_b64: ${{ steps.sign.outputs.signature_b64 }}
    steps:
      - id: sign
        name: Sign exact physical authorization without exposing the key to the runner
        shell: bash
        env:
          AUTHORIZATION_PRIVATE_KEY: ${{ secrets.TASK19_AUTHORIZATION_PRIVATE_KEY }}
          PHYSICAL_AUTHORIZATION_TOKEN: ${{ secrets.TASK19_PHYSICAL_AUTHORIZATION_TOKEN }}
          DEVICE_SERIAL_SHA256: ${{ secrets.TASK19_AUTHORIZED_DEVICE_SERIAL_SHA256 }}
          PROVIDER_RUN_ID: ${{ inputs.provider_run_id }}
          PROVIDER_RUN_ATTEMPT: ${{ inputs.provider_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$PROVIDER_RUN_ID" =~ ^[1-9][0-9]*$ && "$PROVIDER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEVICE_SERIAL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -n "$AUTHORIZATION_PRIVATE_KEY"; test -n "$PHYSICAL_AUTHORIZATION_TOKEN"
          umask 077; key=$(mktemp); receipt=$(mktemp); signature=$(mktemp)
          trap 'rm -f "$key" "$receipt" "$signature"' EXIT
          printf '%s' "$AUTHORIZATION_PRIVATE_KEY" > "$key"
          issued=$(date --utc +%Y-%m-%dT%H:%M:%SZ); expires=$(date --utc --date='+15 minutes' +%Y-%m-%dT%H:%M:%SZ)
          token_sha=$(printf '%s' "$PHYSICAL_AUTHORIZATION_TOKEN" | sha256sum | cut -d' ' -f1)
          jq -c -n --arg repository "$GITHUB_REPOSITORY" --arg runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" --arg headSha "$GITHUB_SHA" --arg providerRunId "$PROVIDER_RUN_ID" --argjson providerRunAttempt "$PROVIDER_RUN_ATTEMPT" --arg physicalAuthorizationSha256 "$token_sha" --arg deviceSerialSha256 "$DEVICE_SERIAL_SHA256" --arg issuedAt "$issued" --arg expiresAt "$expires" '{schemaVersion:1,kind:"task19_physical_authorization",repository:$repository,workflowPath:".github/workflows/task19-installed-qualification.yml",eventName:"workflow_dispatch",environment:"task19-qualification",runId:$runId,runAttempt:$runAttempt,headSha:$headSha,providerRunId:$providerRunId,providerRunAttempt:$providerRunAttempt,physicalAuthorizationSha256:$physicalAuthorizationSha256,deviceSerialSha256:$deviceSerialSha256,issuedAt:$issuedAt,expiresAt:$expiresAt}' > "$receipt"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$receipt" -out "$signature"
          printf 'receipt_b64=%s\n' "$(base64 -w0 "$receipt")" >> "$GITHUB_OUTPUT"
          printf 'signature_b64=%s\n' "$(base64 -w0 "$signature")" >> "$GITHUB_OUTPUT"

  qualify:
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: [self-hosted, Windows, X64, task19-protected]
    timeout-minutes: 130
    permissions: { actions: read, contents: read }
    outputs:
      unsigned_artifact_id: ${{ steps.unsigned-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - name: Validate digest-pinned Task19 runtime and PowerShell syntax before candidate access
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location tooling/qa
          try { bun install --frozen-lockfile; bun test task19 } finally { Pop-Location }
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tooling/qa/task19/protected-runner.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw "TASK19_PROTECTED_RUNNER_SYNTAX_INVALID:$($errors[0].Message)" }
      - name: Observe provider run workflow event attempt SHA artifact digest and expiry
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROVIDER_RUN_ID: ${{ inputs.provider_run_id }}
          PROVIDER_RUN_ATTEMPT: ${{ inputs.provider_run_attempt }}
        run: |
          $context = @{ repository = $env:GITHUB_REPOSITORY; runId = $env:PROVIDER_RUN_ID; runAttempt = [int]$env:PROVIDER_RUN_ATTEMPT; headSha = $env:GITHUB_SHA }
          $context | ConvertTo-Json -Compress | Set-Content -NoNewline provider-context.json
          bun tooling/release/task19-provider-observer-cli.ts --context provider-context.json --output-root task19-candidates --output task19-candidates/task19-exact-candidates.json
      - name: Install exact pinned Android platform-tools and build-tools;35.0.0
        shell: powershell
        env:
          PLATFORM_TOOLS_URL: https://dl.google.com/android/repository/platform-tools_r37.0.1-win.zip
          PLATFORM_TOOLS_SHA256: 45f4d63113e895ebde0c90f194099a4676b6ac653bd28d54314a9e022bbc1a99
          BUILD_TOOLS_URL: https://dl.google.com/android/repository/build-tools_r35_windows.zip
          BUILD_TOOLS_SHA256: 5753c679a1b90bcf6fbc9945a2ce39dfb9e74f1df0831a1e1866ae5b594326f0
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'task19-android-tools'; New-Item $tools -ItemType Directory -ErrorAction Stop | Out-Null
          $platformArchive = Join-Path $tools 'platform-tools.zip'; $buildArchive = Join-Path $tools 'build-tools.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $env:PLATFORM_TOOLS_URL -OutFile $platformArchive
          Invoke-WebRequest -UseBasicParsing -Uri $env:BUILD_TOOLS_URL -OutFile $buildArchive
          if ((Get-Item $platformArchive).Length -ne 8044989 -or (Get-FileHash $platformArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PLATFORM_TOOLS_SHA256) { throw 'TASK19_PLATFORM_TOOLS_DIGEST_MISMATCH' }
          if ((Get-Item $buildArchive).Length -ne 59878107 -or (Get-FileHash $buildArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:BUILD_TOOLS_SHA256) { throw 'TASK19_BUILD_TOOLS_DIGEST_MISMATCH' }
          Expand-Archive $platformArchive (Join-Path $tools 'platform'); Expand-Archive $buildArchive (Join-Path $tools 'build')
          $platformPath = Join-Path $tools 'platform/platform-tools'; $buildPath = Join-Path $tools 'build/android-15'
          if (!(Test-Path (Join-Path $platformPath 'adb.exe')) -or !(Test-Path (Join-Path $buildPath 'apksigner.bat'))) { throw 'TASK19_ANDROID_TOOLS_ARCHIVE_INVALID' }
          if ((Get-Content (Join-Path $buildPath 'source.properties') -Raw) -notmatch 'Pkg.Revision\s*=\s*35\.0\.0') { throw 'TASK19_BUILD_TOOLS_VERSION_MISMATCH' }
          & (Join-Path $platformPath 'adb.exe') version; if ($LASTEXITCODE -ne 0) { throw 'TASK19_ADB_VERSION_FAILED' }
          & (Join-Path $buildPath 'apksigner.bat') version; if ($LASTEXITCODE -ne 0) { throw 'TASK19_APKSIGNER_VERSION_FAILED' }
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$platformPath`n$buildPath`n", [Text.UTF8Encoding]::new($false))
      - name: Verify Windows runner and one authorized physical Android device
        shell: powershell
        run: tooling/qa/task19/runner-preflight.ps1 -Output task19-runner-preflight.json
      - name: Materialize only the signed physical authorization
        shell: powershell
        env:
          AUTHORIZATION_RECEIPT_B64: ${{ needs.authorize.outputs.authorization_receipt_b64 }}
          AUTHORIZATION_SIGNATURE_B64: ${{ needs.authorize.outputs.authorization_signature_b64 }}
        run: |
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'task19-authorization.json'), [Convert]::FromBase64String($env:AUTHORIZATION_RECEIPT_B64))
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'task19-authorization.sig'), $env:AUTHORIZATION_SIGNATURE_B64, [Text.UTF8Encoding]::new($false))
      - name: Execute repository-trusted installed-product qualification
        shell: powershell
        env: { RUNNER_LABELS: 'self-hosted,Windows,X64,task19-protected' }
        run: >-
          node tooling/qa/task19/installed-runner.mjs --execute
          --candidates task19-candidates/task19-exact-candidates.json
          --preflight task19-runner-preflight.json
          --authorization "${{ runner.temp }}\task19-authorization.json"
          --authorization-signature "${{ runner.temp }}\task19-authorization.sig"
          --output task19-output
      - name: Remove trusted temporary material and verify post-cleanup absence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item (Join-Path $env:RUNNER_TEMP 'task19-authorization.json'),(Join-Path $env:RUNNER_TEMP 'task19-authorization.sig'),(Join-Path $env:RUNNER_TEMP 'task19-android-tools') -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'task19-authorization.json')) { throw 'TASK19_CLEANUP_POST_STATE_FAILED' }
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'task19-authorization.sig')) { throw 'TASK19_CLEANUP_POST_STATE_FAILED' }
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'task19-android-tools')) { throw 'TASK19_CLEANUP_POST_STATE_FAILED' }
          if (Get-Process -Name 'jastreamer-server','jastreamer-control','jastreamer-renderer' -ErrorAction SilentlyContinue) { throw 'TASK19_CLEANUP_POST_STATE_FAILED' }
          if (Get-AppxPackage -Name 'io.jastreamer.control') { throw 'TASK19_CLEANUP_POST_STATE_FAILED' }
      - id: unsigned-artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'task19-unsigned-boundary-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            task19-output
            task19-candidates
          if-no-files-found: error
      - name: Remove private workspace material after the exact upload boundary
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item task19-output,task19-candidates,provider-context.json,task19-runner-preflight.json -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path 'task19-output') { throw 'TASK19_PRIVATE_WORKSPACE_CLEANUP_FAILED' }
          if (Test-Path 'task19-candidates') { throw 'TASK19_PRIVATE_WORKSPACE_CLEANUP_FAILED' }
          if (Test-Path 'provider-context.json') { throw 'TASK19_PRIVATE_WORKSPACE_CLEANUP_FAILED' }
          if (Test-Path 'task19-runner-preflight.json') { throw 'TASK19_PRIVATE_WORKSPACE_CLEANUP_FAILED' }

  sign-evidence:
    needs: qualify
    if: needs.qualify.result == 'success'
    environment: task19-evidence-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          artifact-ids: '${{ needs.qualify.outputs.unsigned_artifact_id }}'
          path: signed-boundary
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: '${{ github.run_id }}'
      - name: Sign evidence outside the candidate execution host
        env:
          TASK19_SIGNING_KEY: ${{ secrets.TASK19_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$TASK19_SIGNING_KEY"
          umask 077; key=$(mktemp); trap 'rm -f "$key"' EXIT
          printf '%s' "$TASK19_SIGNING_KEY" > "$key"
          node tooling/qa/task19/evidence-signer.mjs --execution signed-boundary/task19-output/execution-result.json --key "$key" --output signed-boundary/task19-output/execution-result.signed.json
      - name: Validate signed evidence against repository production trust
        run: node tooling/qa/task19/installed-runner.mjs --candidates signed-boundary/task19-candidates/task19-exact-candidates.json --validate-execution signed-boundary/task19-output/execution-result.signed.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: 'task19-installed-receipt-${{ github.run_id }}-${{ github.run_attempt }}', path: signed-boundary/task19-output, if-no-files-found: error }
