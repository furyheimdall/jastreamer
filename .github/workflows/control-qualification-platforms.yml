name: control-qualification-platforms

on:
  workflow_call:
    inputs:
      version: { required: true, type: string }

permissions:
  contents: read

jobs:
  web:
    if: github.repository == 'furyheimdall/jastreamer'
    runs-on: ubuntu-24.04
    env: { VERSION: '${{ inputs.version }}' }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.25.6', check-latest: false, cache: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: { flutter-version: '3.35.1', channel: stable, cache: false }
      - name: Build real installable Web PWA
        run: |
          cd apps/control
          flutter pub get --enforce-lockfile
          flutter build web --release --build-name "$VERSION"
          cd build/web
          zip -X -q -r "../../../../jastreamer-control_${VERSION}_web.zip" .
          unzip -t "../../../../jastreamer-control_${VERSION}_web.zip"
      - name: Run exact staged Web QA
        env:
          CONTROL_WEB_ROOT: ${{ runner.temp }}/control-web-candidate
          CONTROL_FIXTURE: ${{ github.workspace }}/tooling/fixtures/e2e/control-policy-happy.yaml
          CONTROL_OUTPUT: ${{ runner.temp }}/control-web-qa
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/jastreamer-control_${VERSION}_web.zip"
          rm -rf "$CONTROL_WEB_ROOT" "$CONTROL_OUTPUT"
          mkdir -p "$CONTROL_WEB_ROOT" "$CONTROL_OUTPUT"
          unzip -q "$archive" -d "$CONTROL_WEB_ROOT"
          test -f "$CONTROL_WEB_ROOT/index.html"
          cd tooling/qa
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bunx playwright test --config playwright.config.mjs control.playwright.mjs --browser chromium --workers 1 --reporter line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-web-candidate-ci
          path: jastreamer-control_${{ inputs.version }}_web.zip
          if-no-files-found: error
