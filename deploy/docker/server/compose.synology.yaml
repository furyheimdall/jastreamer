services:
  jstreamer-server:
    image: "${JSTREAMER_SERVER_IMAGE:-ghcr.io/furyheimdall/jstreamer-server:0.1.0}"
    network_mode: host
    user: "10001:10001"
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      JSTREAMER_LAN_INTERFACE: "${JSTREAMER_LAN_INTERFACE:-REQUIRED_AT_DEPLOYMENT}"
      JSTREAMER_ADVERTISED_ADDRESS: "${JSTREAMER_ADVERTISED_ADDRESS:-REQUIRED_AT_DEPLOYMENT}"
      JSTREAMER_DATA_DIR: /var/lib/jstreamer
    volumes:
      - type: bind
        source: "${JSTREAMER_DATA_PATH:-/volume1/docker/jake-streamer/data}"
        target: /var/lib/jstreamer
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/jstreamer-server", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
