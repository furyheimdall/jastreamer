services:
  jastreamer-server:
    image: "${JASTREAMER_SERVER_IMAGE:-ghcr.io/furyheimdall/jastreamer-server:0.1.0}"
    command: ["--config", "/etc/jastreamer/server.json"]
    network_mode: host
    user: "10001:10001"
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      JASTREAMER_SETUP_SECRET: "${JASTREAMER_SETUP_SECRET:?JASTREAMER_SETUP_SECRET must be injected at runtime}"
      JASTREAMER_DATA_DIR: /var/lib/jastreamer
    volumes:
      - type: bind
        source: "${JASTREAMER_DATA_PATH:-/volume1/docker/jastreamer/data}"
        target: /var/lib/jastreamer
      - type: bind
        source: "${JASTREAMER_CONFIG_PATH:-/volume1/docker/jastreamer/config}"
        target: /etc/jastreamer
        read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/usr/local/bin/jastreamer-server", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: [no-new-privileges:true]
