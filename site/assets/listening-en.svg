<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" width="720" height="1080" role="img" aria-labelledby="t d" lang="en">
  <title id="t">Concept illustration: how listening works with jastreamer</title>
  <desc id="d">Legend: a solid line is audio; a dashed line is control. Controllers, such as a phone, tablet or browser, send commands only (play, queue, volume and output choice) to the jastreamer Server; audio for network receivers is not relayed through them. The Server keeps the library and one shared queue and sends audio to one selected output at a time. Either output on this device: a browser or app plays to speakers, headphones or a USB DAC, with optional exclusive or USB-direct output in the Windows, Mac and Android apps. Or a network output on the LAN: a UPnP/DLNA, Cast or AirPlay receiver.</desc>
  <style>
    svg {
      --page: #111315; --nas-top: #2d3438; --nas-bottom: #1f2427; --panel: #1b1f22; --panel-raised: #252b2f; --deep: #0c0e0f; --wood: #2c3236;
      --text: #f4f4ec; --muted: #9aa3a6; --soft: #c9cec7;
      --accent: #c8edb2; --accent-strong: #e3f7c8; --accent-ink: #162111; --tile: #344c3d;
      --border: #ffffff1f; --border-strong: #ffffff33;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    text { font-family: var(--sans); fill: var(--text); }
    .concept { font: 700 24px var(--mono); fill: var(--muted); letter-spacing: 0.12em; }
    .k { font: 700 24px var(--mono); fill: var(--accent); letter-spacing: 0.12em; }
    .h { font-size: 30px; font-weight: 700; }
    .b { font-size: 26px; font-weight: 700; }
    .m { font-size: 26px; fill: var(--soft); }
    .em { font-size: 26px; fill: var(--accent-strong); }
    .s { font-size: 24px; fill: var(--muted); }
    .lg { font-size: 24px; font-weight: 700; fill: var(--soft); }
    .lbl { font: 700 24px var(--mono); fill: var(--text); }
    .lc { font-size: 24px; font-weight: 700; fill: var(--text); }
    .or { font-size: 24px; font-weight: 700; fill: var(--accent); }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 2; }
    .dev { fill: var(--panel-raised); stroke: var(--border-strong); stroke-width: 2; }
    .scr { fill: var(--deep); }
    .tile { fill: var(--tile); }
    .ac { fill: var(--accent); }
    .gear { fill: none; stroke: var(--soft); stroke-width: 3; stroke-linecap: round; }
    .cmd { fill: none; stroke: var(--text); stroke-width: 3; stroke-dasharray: 10 9; stroke-linecap: round; }
    .audio { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
    .orpill { fill: var(--page); stroke: var(--accent); stroke-width: 2; }
    .proto { fill: var(--panel-raised); stroke: var(--border-strong); stroke-width: 2; }
  </style>
  <defs>
    <marker id="ha" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1 11 6 1 11z" style="fill: var(--accent)"/></marker>
    <marker id="hc" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 11 6 1 11z" style="fill: var(--text)"/></marker>
    <linearGradient id="nas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--nas-top)"/><stop offset="1" style="stop-color: var(--nas-bottom)"/></linearGradient>
  </defs>

  <text class="concept" x="4" y="30">CONCEPT ILLUSTRATION</text>

  <!-- Legend: line style, not only color, separates audio from control -->
  <path class="audio" d="M6 66H52" marker-end="url(#ha)"/>
  <text class="lg" x="70" y="74">Audio</text>
  <path class="cmd" d="M220 66H270" marker-end="url(#hc)"/>
  <text class="lg" x="288" y="74">Control</text>

  <!-- Controllers -->
  <rect class="panel" x="1" y="108" width="718" height="232" rx="24"/>
  <text class="k" x="32" y="148">CONTROLLERS</text>
  <text class="h" x="32" y="188">Phone, tablet or browser</text>
  <g aria-hidden="true">
    <rect class="dev" x="48" y="212" width="60" height="88" rx="10"/>
    <rect class="scr" x="54" y="220" width="48" height="72" rx="5"/>
    <rect class="tile" x="61" y="227" width="34" height="34" rx="4"/>
    <circle class="ac" cx="78" cy="278" r="6"/>
    <rect class="dev" x="134" y="222" width="146" height="66" rx="8"/>
    <rect class="scr" x="142" y="229" width="130" height="52" rx="4"/>
    <rect class="tile" x="150" y="236" width="30" height="30" rx="3"/>
    <rect x="190" y="241" width="66" height="6" rx="3" style="fill: var(--soft)"/>
    <rect x="190" y="255" width="44" height="6" rx="3" style="fill: var(--muted)"/>
    <path class="dev" d="M124 288h166l-10 12H134z"/>
  </g>
  <text class="b" x="310" y="230">Sends commands only</text>
  <text class="m" x="310" y="268">Play, queue, volume, output</text>
  <text class="em" x="310" y="306">Network audio bypasses it</text>

  <!-- Commands: controller to Server -->
  <path class="cmd" d="M190 340V404" marker-end="url(#hc)"/>
  <text class="lbl" x="206" y="380">commands</text>

  <!-- Server -->
  <g aria-hidden="true">
    <rect x="120" y="416" width="140" height="110" rx="14" fill="url(#nas)" style="stroke: var(--border-strong); stroke-width: 2"/>
    <rect x="136" y="430" width="22" height="62" rx="4" class="scr"/>
    <rect x="166" y="430" width="22" height="62" rx="4" class="scr"/>
    <rect x="196" y="430" width="22" height="62" rx="4" class="scr"/>
    <rect x="226" y="430" width="22" height="62" rx="4" class="scr"/>
    <circle class="ac" cx="147" cy="482" r="3"/><circle class="ac" cx="177" cy="482" r="3"/><circle class="ac" cx="207" cy="482" r="3"/><circle class="ac" cx="237" cy="482" r="3"/>
    <rect x="136" y="506" width="40" height="5" rx="2.5" style="fill: var(--border-strong)"/>
    <circle class="ac" cx="244" cy="509" r="5"/>
  </g>
  <text class="h" x="288" y="448">jastreamer Server</text>
  <text class="m" x="288" y="486">Library · one shared queue</text>
  <text class="em" x="288" y="524">One selected output at a time</text>

  <!-- Audio trunk: Server to one selected output (alternatives) -->
  <path class="audio" d="M118 472H56q-16 0-16 16V938q0 16 16 16H96" marker-end="url(#ha)"/>
  <path class="audio" d="M40 624q0 16 16 16H96" marker-end="url(#ha)"/>

  <!-- Output: this device -->
  <rect class="panel" x="72" y="568" width="647" height="234" rx="24"/>
  <text class="k" x="104" y="608">OUTPUT · THIS DEVICE</text>
  <text class="h" x="104" y="650">Browser or app</text>
  <text class="m" x="104" y="690">Speakers, headphones or USB DAC</text>
  <text class="s" x="104" y="734">Optional exclusive or USB-direct output</text>
  <text class="s" x="104" y="766">in the Windows, Mac and Android apps</text>
  <g aria-hidden="true">
    <rect class="dev" x="544" y="594" width="86" height="56" rx="6"/>
    <rect class="scr" x="550" y="600" width="74" height="44" rx="3"/>
    <rect class="tile" x="556" y="606" width="24" height="24" rx="3"/>
    <rect x="586" y="610" width="30" height="5" rx="2.5" style="fill: var(--soft)"/>
    <path class="dev" d="M536 650h102l-6 8H542z"/>
    <path d="M648 614a20 22 0 0 1 40 0" style="fill: none; stroke: var(--text); stroke-width: 5; stroke-linecap: round"/>
    <rect x="642" y="608" width="12" height="22" rx="6" style="fill: var(--text)"/>
    <rect x="682" y="608" width="12" height="22" rx="6" style="fill: var(--text)"/>
    <path class="gear" d="M638 654c4 0 6 8 10 8"/>
    <rect class="dev" x="648" y="652" width="42" height="22" rx="5"/>
    <circle class="ac" cx="660" cy="663" r="3"/>
  </g>

  <rect class="orpill" x="361" y="822" width="68" height="40" rx="20"/>
  <text class="or" x="395" y="850" text-anchor="middle">or</text>

  <!-- Output: network receivers, three protocol routes -->
  <rect class="panel" x="72" y="882" width="647" height="180" rx="24"/>
  <text class="k" x="104" y="922">OUTPUT · NETWORK</text>
  <text class="h" x="104" y="964">Receiver on your LAN</text>
  <rect class="proto" x="104" y="988" width="180" height="44" rx="22"/>
  <text class="lc" x="194" y="1018" text-anchor="middle">UPnP/DLNA</text>
  <rect class="proto" x="308" y="988" width="180" height="44" rx="22"/>
  <text class="lc" x="398" y="1018" text-anchor="middle">Cast</text>
  <rect class="proto" x="512" y="988" width="180" height="44" rx="22"/>
  <text class="lc" x="602" y="1018" text-anchor="middle">AirPlay</text>
</svg>
